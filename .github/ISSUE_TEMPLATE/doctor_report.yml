name: Doctor report
description: Share a snap doctor health report.
title: "[doctor]: "
labels: ["doctor", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove private paths, repository names, tokens, and secrets before posting output.
  - type: input
    id: os
    attributes:
      label: OS and shell
      placeholder: Windows 11 PowerShell, Ubuntu 24.04 bash, WSL2, etc.
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: Git version
      placeholder: git --version
    validations:
      required: true
  - type: input
    id: snap-version
    attributes:
      label: Snap version or commit
      placeholder: snap --version, Cargo version, or commit SHA
  - type: textarea
    id: doctor-output
    attributes:
      label: snap doctor output
      render: text
      description: Prefer source-built `./target/release/snap doctor` output if testing this repository.
    validations:
      required: true
  - type: dropdown
    id: repair-used
    attributes:
      label: Did you run repair mode?
      options:
        - "No"
        - "Yes, snap doctor --repair"
        - "Yes, snap doctor --repair --accept-metadata-loss"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What happened before the health issue appeared?
