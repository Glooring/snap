name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v7.2.0"
        required: true
        type: string
      publish:
        description: "Publish immediately instead of creating a draft"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  linux:
    name: Linux assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate release tag
        run: |
          set -euo pipefail
          version="$(cargo pkgid | sed 's/.*#//')"
          expected="v${version}"
          if [ "${{ inputs.tag }}" != "$expected" ]; then
            echo "Release tag '${{ inputs.tag }}' does not match Cargo version '$expected'." >&2
            exit 1
          fi

      - name: Build Linux release assets
        run: bash ./scripts/release-linux.sh

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          if-no-files-found: error
          path: |
            release-github/${{ inputs.tag }}/snap-${{ inputs.tag }}-linux-x86_64
            release-github/${{ inputs.tag }}/snap-${{ inputs.tag }}-linux-x86_64.tar.gz

  windows:
    name: Windows assets
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Windows release tooling
        shell: powershell
        run: |
          cargo install cargo-wix --locked
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate release tag
        shell: powershell
        run: |
          $version = ((cargo pkgid) -split "#")[-1].Trim()
          $expected = "v$version"
          if ("${{ inputs.tag }}" -ne $expected) {
              throw "Release tag '${{ inputs.tag }}' does not match Cargo version '$expected'."
          }

      - name: Build Windows release assets
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\release-windows.ps1

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          if-no-files-found: error
          path: |
            release-github/${{ inputs.tag }}/snap-${{ inputs.tag }}-windows-x86_64.exe
            release-github/${{ inputs.tag }}/snap-${{ inputs.tag }}-windows-x86_64-setup.exe
            release-github/${{ inputs.tag }}/snap-${{ inputs.tag }}-windows-x86_64.msi

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate assets and checksums
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          notes_file="doc/releases/${tag#v}.md"
          upload_dir="release-upload"

          test -f "$notes_file"
          rm -rf "$upload_dir"
          mkdir -p "$upload_dir"

          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [ -e "$upload_dir/$base" ]; then
              echo "Duplicate release asset basename: $base" >&2
              exit 1
            fi
            cp "$file" "$upload_dir/$base"
          done < <(find release-assets -type f -print0)

          test -f "$upload_dir/snap-${tag}-linux-x86_64"
          test -f "$upload_dir/snap-${tag}-linux-x86_64.tar.gz"
          test -f "$upload_dir/snap-${tag}-windows-x86_64.exe"
          test -f "$upload_dir/snap-${tag}-windows-x86_64-setup.exe"
          test -f "$upload_dir/snap-${tag}-windows-x86_64.msi"

          cd "$upload_dir"
          sha256sum snap-${tag}-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          notes_file="doc/releases/${tag#v}.md"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release '$tag' already exists." >&2
            exit 1
          fi

          args=(
            release create "$tag"
            release-upload/*
            --target "$GITHUB_SHA"
            --title "snap $tag"
            --notes-file "$notes_file"
          )

          if [ "${{ inputs.publish }}" != "true" ]; then
            args+=(--draft)
          fi

          gh "${args[@]}"
